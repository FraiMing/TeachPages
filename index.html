<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeachPages · GitHub Actions 部署示范</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: radial-gradient(1200px 600px at 50% -10%, #1f2937 0%, var(--bg) 55%);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 36px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .45);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      letter-spacing: .3px;
      color: var(--green);
      background: rgba(63, 185, 80, .1);
      border: 1px solid rgba(63, 185, 80, .3);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 22px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(63, 185, 80, .16);
    }
    h1 { margin: 0 0 10px; font-size: 27px; letter-spacing: -.4px; }
    h1 code {
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 23px;
      background: none;
    }
    p.lead { margin: 0 0 28px; color: var(--muted); font-size: 15px; }
    .steps { list-style: none; margin: 0 0 26px; padding: 0; counter-reset: s; }
    .steps li {
      position: relative;
      counter-increment: s;
      padding: 11px 0 11px 42px;
      border-bottom: 1px solid var(--border);
      font-size: 14.5px;
    }
    .steps li:last-child { border-bottom: 0; }
    .steps li::before {
      content: counter(s);
      position: absolute;
      left: 0; top: 12px;
      width: 25px; height: 25px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: rgba(88, 166, 255, .12);
      border: 1px solid rgba(88, 166, 255, .35);
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 600;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .92em;
      background: rgba(110, 118, 129, .22);
      padding: 2px 6px;
      border-radius: 5px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      font-size: 13px;
      color: var(--muted);
    }
    .meta b { color: var(--fg); font-weight: 600; }
    .stamp { margin-top: 18px; font-size: 12px; color: #6e7681; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge"><span class="dot"></span>Deployed via GitHub Actions</span>

    <h1>部署成功 · <code>TeachPages</code></h1>
    <p class="lead">你看到的这个页面，是由 GitHub Actions 自动发布到 GitHub Pages 的。</p>

    <ol class="steps">
      <li>提交并推送代码到 <code>main</code> 分支</li>
      <li>Actions 自动触发，依次执行 checkout → 打包 → 部署</li>
      <li>产物发布到 Pages，几秒后即可访问</li>
    </ol>

    <div class="meta">
      <span>仓库：<b>FraiMing/TeachPages</b></span>
      <span>触发方式：<b>push / 手动</b></span>
      <span>构建器：<b>ubuntu-latest</b></span>
    </div>

    <p class="stamp" id="stamp">页面加载于 —</p>
  </main>

  <script>
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    document.getElementById("stamp").textContent =
      `页面加载于 ${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
      `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  </script>
</body>
</html>
